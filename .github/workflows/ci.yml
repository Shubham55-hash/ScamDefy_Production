name: ScamDefy CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ─── Job 1: Python Tests ──────────────────────────────────────────────────────
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0" "torchaudio>=2.0.0"
          pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        env:
          GEMINI_API_KEY: "ci-placeholder"
          GOOGLE_SAFE_BROWSING_API_KEY: "ci-placeholder"
          URLHAUS_API_KEY: "ci-placeholder"
        run: pytest tests/ -v

  # ─── Job 2: Docker Build & Smoke Test ─────────────────────────────────────────
  docker-build:
    name: Build & Smoke Test Docker Image
    runs-on: ubuntu-latest
    needs: test          # Only build if unit and integration tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('api/Dockerfile', 'api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          tags: scamdefy-api:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevent cache from growing indefinitely
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Smoke-test: start the container and verify both endpoints
      - name: Smoke test container
        run: |
          docker run -d \
            --name scamdefy-ci \
            -p 8000:8000 \
            -e GEMINI_API_KEY=ci-placeholder \
            -e GOOGLE_SAFE_BROWSING_API_KEY=ci-placeholder \
            -e URLHAUS_API_KEY=ci-placeholder \
            scamdefy-api:${{ github.sha }}

          echo "Waiting for API to become ready..."
          READY=0
          for i in $(seq 1 30); do
            # Check if container died prematurely
            if ! docker ps -q --filter "name=scamdefy-ci" --filter "status=running" | grep -q .; then
              echo "ERROR: Container exited unexpectedly."
              docker logs scamdefy-ci
              exit 1
            fi

            # Check root endpoint
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "API root is responding (attempt $i)!"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: API did not become ready within timeout."
            docker logs scamdefy-ci
            exit 1
          fi

          # Verify root response payload
          echo "Verifying root endpoint..."
          ROOT_RESP=$(curl -sf http://localhost:8000/)
          echo "$ROOT_RESP" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='active', f'Unexpected status: {d}'"

          # Verify health response payload
          echo "Verifying health endpoint..."
          HEALTH_RESP=$(curl -sf http://localhost:8000/api/health)
          echo "$HEALTH_RESP" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='ok', f'Health check failed: {d}'"

          echo "Smoke test passed successfully!"

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker stop scamdefy-ci || true
          docker rm scamdefy-ci || true
