name: ScamDefy CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# ── Workflow-level permissions ────────────────────────────────────────────────
# Set the minimum required at workflow level.
# The publish job overrides this with packages:write — no other job holds it.
permissions:
  contents: read

jobs:
  # ─── Job 1: Python Tests ──────────────────────────────────────────────────────
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only — no registry access
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0" "torchaudio>=2.0.0"
          pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        env:
          GEMINI_API_KEY: "ci-placeholder"
          GOOGLE_SAFE_BROWSING_API_KEY: "ci-placeholder"
          URLHAUS_API_KEY: "ci-placeholder"
        run: pytest tests/ -v

  # ─── Job 2: Docker Build & Smoke Test ─────────────────────────────────────────
  # Runs on every push and pull request. Builds locally (no registry push),
  # starts a container, and verifies both API endpoints respond correctly.
  docker-build:
    name: Build & Smoke Test Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read   # checkout only — image is loaded locally, never pushed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('api/Dockerfile', 'api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (local load, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          tags: scamdefy-api:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Smoke test container
        run: bash .github/scripts/smoke-test.sh "scamdefy-api:${{ github.sha }}"

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker stop scamdefy-ci || true
          docker rm scamdefy-ci || true

  # ─── Job 3: Publish to GHCR ───────────────────────────────────────────────────
  # Runs ONLY on push to main — never on pull requests.
  # Requires both test and docker-build (smoke test) to pass first.
  # Uses the built-in GITHUB_TOKEN — no PAT or repository secret required.
  #
  # The image is pushed untagged (by digest), smoke-tested from the registry, and
  # only then tagged — so the tags always point at the exact bytes that passed.
  #   ghcr.io/shubham55-hash/scamdefy-api:sha-<full-commit-sha>   (always)
  #   ghcr.io/shubham55-hash/scamdefy-api:latest                  (only if this
  #     commit is still the head of main, so older/re-run builds can't roll it back)
  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One publish at a time; a newer queued run supersedes an older queued one.
    concurrency:
      group: ghcr-publish-main
      cancel-in-progress: false
    permissions:
      contents: read    # checkout + main-head check
      packages: write   # push image to GHCR — scoped to this job only
    env:
      IMAGE: ghcr.io/shubham55-hash/scamdefy-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('api/Dockerfile', 'api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push untagged image by digest (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Smoke test pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          bash .github/scripts/smoke-test.sh "$IMAGE@$DIGEST"

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker stop scamdefy-ci || true
          docker rm scamdefy-ci || true

      - name: Tag tested image with commit SHA
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:sha-${{ github.sha }}" "$IMAGE@$DIGEST"

      - name: Promote to latest if still head of main
        id: promote
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          MAIN_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_HEAD" != "${{ github.sha }}" ]; then
            echo "::notice::main has moved to $MAIN_HEAD; not moving latest to ${{ github.sha }}."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Image published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| commit | \`$IMAGE:sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| latest | ${{ steps.promote.outputs.promoted == 'true' && 'updated' || 'unchanged (newer commit on main)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| digest | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          echo "| platform | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook secret is missing"
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
